---
layout: default
---

<h1>{{ page.title }}</h1>

{{ content }}

{% if page.photos %}
<div class="climbing-gallery">
  {% for photo_url in page.photos %}
    <a href="{{ photo_url }}" class="climbing-photo" onclick="openModal({{ forloop.index0 }}); return false;">
      <img src="{{ photo_url }}" alt="{{ page.title }}" loading="lazy">
    </a>
  {% endfor %}
</div>
{% endif %}

{% if page.videos %}
<div class="climbing-videos">
  {% for video_url in page.videos %}
    <video controls preload="metadata">
      <source src="{{ video_url }}" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  {% endfor %}
</div>
{% endif %}

<!-- Modal -->
<div id="imageModal" class="modal" onclick="closeModal(event)">
  <span class="modal-close" onclick="closeModal(event)">&times;</span>
  <a class="modal-prev" onclick="changeImage(-1); event.stopPropagation();">&#10094;</a>
  <a class="modal-next" onclick="changeImage(1); event.stopPropagation();">&#10095;</a>
  <img class="modal-content" id="modalImage">
</div>

<style>
.climbing-gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin: 2rem 0;
}

.climbing-photo {
  display: block;
  overflow: hidden;
  border-radius: 4px;
  transition: transform 0.2s ease;
  cursor: pointer;
}

.climbing-photo:hover {
  transform: scale(1.02);
}

.climbing-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  aspect-ratio: 1 / 1;
}

.climbing-videos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1rem;
  margin: 2rem 0;
}

.climbing-videos video {
  width: 100%;
  border-radius: 4px;
}

/* Modal styles */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  padding: 0;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0, 0, 0, 0.9);
}

.modal-content {
  margin: auto;
  display: block;
  max-width: 90%;
  max-height: 90vh;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  object-fit: contain;
}

.modal-close {
  position: absolute;
  top: 15px;
  right: 35px;
  color: #f1f1f1;
  font-size: 40px;
  font-weight: bold;
  cursor: pointer;
  z-index: 1001;
}

.modal-close:hover,
.modal-close:focus {
  color: #bbb;
}

.modal-prev,
.modal-next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  width: auto;
  padding: 16px;
  margin-top: -22px;
  color: white;
  font-weight: bold;
  font-size: 40px;
  transition: 0.3s ease;
  user-select: none;
  z-index: 1001;
}

.modal-next {
  right: 0;
}

.modal-prev {
  left: 0;
}

.modal-prev:hover,
.modal-next:hover {
  background-color: rgba(0, 0, 0, 0.8);
}
</style>

<script>
var photoUrls = [
  {% for photo_url in page.photos %}
    "{{ photo_url }}"{% unless forloop.last %},{% endunless %}
  {% endfor %}
];

var currentImageIndex = 0;

function openModal(index) {
  currentImageIndex = index;
  var modal = document.getElementById('imageModal');
  var modalImg = document.getElementById('modalImage');
  modal.style.display = 'block';
  modalImg.src = photoUrls[currentImageIndex];
}

function closeModal(event) {
  if (event) {
    event.stopPropagation();
  }
  document.getElementById('imageModal').style.display = 'none';
}

function changeImage(direction) {
  currentImageIndex += direction;
  
  // Wrap around
  if (currentImageIndex >= photoUrls.length) {
    currentImageIndex = 0;
  } else if (currentImageIndex < 0) {
    currentImageIndex = photoUrls.length - 1;
  }
  
  var modalImg = document.getElementById('modalImage');
  modalImg.src = photoUrls[currentImageIndex];
}

// Close modal on ESC key, navigate with arrow keys
document.addEventListener('keydown', function(event) {
  var modal = document.getElementById('imageModal');
  if (modal.style.display === 'block') {
    if (event.key === 'Escape') {
      closeModal();
    } else if (event.key === 'ArrowLeft') {
      changeImage(-1);
    } else if (event.key === 'ArrowRight') {
      changeImage(1);
    }
  }
});
</script>
